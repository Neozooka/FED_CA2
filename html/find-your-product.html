<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet"> -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <script src="../javascript/header-footer.js" defer></script>
        <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="../css/style.css">
    </head>

    <body>

        <div id="header-container"></div>

        <article class="flex flex-col items-center justify-center p-8 text-white min-h-screen font-sans" style="background-color: var(--background);">

            

        </article>


        <div id="footer-container"></div>

        <script>
            const userEmail = document.getElementById("user-email")
            const userSubject = document.getElementById("user-subject")
            const userContent = document.getElementById("user-content")

            let emailList = []
            let subjectList = []
            let contentList = []
            let content = false
            let subject = false

            function showAlert(inputElement, alertElement, msg, isValid) {
                if (isValid) {
                    inputElement.classList.remove("border-red-500")
                    inputElement.classList.add("border-transparent")
                    alertElement.classList.add("hidden")
                    alertElement.innerText = ""
                } else {
                    inputElement.classList.remove("border-transparent")
                    inputElement.classList.add("border-red-500")
                    alertElement.classList.remove("hidden")
                    alertElement.innerText = msg
                }
            }

            userEmail.addEventListener("input", e => {
                const value = e.target.value.trim()
                const emailCheck = /^[^\s@]+@[^\s@]+\.[^\s@]+$/
                const isValid = emailCheck.test(value);
                const msg = "Please enter a valid email address (e.g., name@domain.com)."
                
                showAlert(userEmail, document.getElementById("email-alert"), msg, isValid || value.length === 0)
            })

            userSubject.addEventListener("input", e => {
                const value = e.target.value.trim()
                const isValid = value.length > 0
                const msg = "Subject cannot be empty."
                
                if (isValid) {
                   subject = true
                }

                showAlert(userSubject, document.getElementById("subject-alert"), msg, isValid || e.target.value.length === 0)
            })

            userContent.addEventListener("input", e => {
                const value = e.target.value.trim()
                const isValid = value.length > 0
                const msg = "Content box cannot be empty."

                if (isValid) {
                   content = true
                }
                
                showAlert(userContent, document.getElementById("content-alert"), msg, isValid || e.target.value.length === 0)
            })
        </script>

    </body>

</html>
