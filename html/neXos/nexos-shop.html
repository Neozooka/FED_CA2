        <link rel="icon" type="image/x-icon" href="/images/neXuslogo2.png">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="../../css/style.css">

        <script src="../../javascript/header-footer.js" defer></script>
        <script src="../../javascript/reveal-on-scroll.js" defer></script>
        <script src="../../javascript/main-shop.js" defer></script>

                    </h2>

                <div class="max-w-5xl w-full space-y-10">

                            </div>

                            <div class="pt-2 flex flex-col items-center md:items-start space-y-2">
                                <p class="text-sm text-neutral-400 font-medium">
                                    <span class="text-base font-bold text-white">$39.99</span> including tax
                                </p>
                                <button 
                                    type="button" 
                                    onclick="addCart('nexos-pro-26-07')" 
                                    class="main-button px-8 py-3 rounded-full shadow-lg inline-block cursor-pointer">
                                    Add to cart
                                </button>
                            </div>
                        </div>

                        <!-- Right Content: Monitor & Learn More -->
                        <div class="w-full md:w-1/2 flex flex-col items-center md:items-end justify-center space-y-4">

                            <div class="relative w-full aspect-[3576/2764] max-w-[850px]">

                                <div class="absolute top-[1.2%] left-[1.1%] w-[97.8%] h-[68.8%] rounded-sm overflow-hidden bg-black z-10 pointer-events-none">
                                    <img src="../../images/desktop-tiling.png" alt="NexOS Desktop Tiling Environment" class="w-full h-full object-cover select-none">
                                </div>

                                <!-- 3576x2764 Monitor Cutout Overlay -->
                                <img src="../../images/monitor-stand.webp" alt="Monitor Display" class="w-full h-full object-contain pointer-events-none relative z-30 block">

                            </div>
                            <div class="w-full text-center md:text-right pr-4">
                                <a href="nexos-pro.html" class="inline-flex items-center text-lg md:text-xl font-bold text-white hover:text-[--maingreen] transition-colors underline underline-offset-4 decoration-2">
                                    &gt; Learn more
                                </a>
                            </div>
                        </div>

                    </div>

                    <!-- Card 2: NexOS CORE -->

                        <!-- Left Content: Monitor -->
                        <div class="w-full md:w-1/2 flex justify-center items-center">
                            <div class="relative w-full aspect-[3576/2764] max-w-[850px]">
                                
                                <!-- Desktop Preview Image Container mapped behind the monitor frame -->
                                <div class="absolute top-[1.2%] left-[1.1%] w-[97.8%] h-[68.8%] rounded-sm overflow-hidden bg-black z-10 pointer-events-none">
                                    <img src="../../images/desktop-mode.jpg" alt="NexOS Desktop" class="w-full h-full object-cover select-none">
                                </div>

                                <!-- 3576x2764 Monitor Cutout Overlay -->
