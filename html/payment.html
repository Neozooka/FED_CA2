<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" type="image/x-icon" href="/images/neXuslogo2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    
    <script src="../javascript/main-shop.js" defer></script>
    <script src="../javascript/header-footer.js"></script>
    <script src="../javascript/chatbot.js"></script>
    <script src="../javascript/payment.js" defer></script>
</head>

<!-- DONE BY LIANG JUN AND JIA JUN -->

<body>

    <div id="header-container" class="sticky top-0 z-50"></div>

    <!-- QR Code Modal (Hidden by default, used for PayNow/PayLah payment methods) -->
    <div id="qrModal" onclick="closeOnOutsideClick(event)" class="fixed inset-0 bg-black/80 z-40 hidden flex items-center justify-center p-4">
        
        <!-- Modal Card Container -->
        <div class="bg-[var(--background)] border border-gray-700 rounded-xl p-6 sm:p-8 relative max-w-sm w-full text-center shadow-xl max-h-[85vh] flex flex-col items-center justify-center">
            
            <!-- Modal Close Button -->
            <button onclick="closeQR()" class="absolute top-3 right-4 text-gray-400 hover:text-white text-4xl font-thin leading-none p-1 transition-colors">
                &times;
            </button>
            
            <!-- QR Code Title Container -->
            <div id="qrTitle" class="mb-4"></div>
            
            <!-- Dynamically Loaded QR Code Image -->
            <img id="qrImage" src="#" alt="QR Code" class="w-full max-w-[280px] sm:max-w-[360px] max-h-[50vh] aspect-square mx-auto bg-white p-3 rounded-lg object-contain">
        </div>

    </div>

    <!-- Main Shopping Cart & Checkout Article -->
    <article class="flex flex-col items-center justify-center w-full px-4 sm:px-6 lg:px-8">

        <!-- Shopping Cart Section -->
        <section class="w-full max-w-screen-xl mx-auto flex flex-col border border-gray-700 flex-shrink-0 py-6 rounded-xl">
            
            <!-- Header: Title and Product Search Input -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mx-4 sm:mx-8 pb-6 gap-4">

                <h2 class="text-3xl sm:text-4xl md:text-6xl">Your Cart</h2>

                <!-- Search Field -->
                <div class="flex flex-row items-center justify-between w-full sm:w-auto">
                    <input id="search2" class="min-w-0 flex-1 rounded-l border border-[rgb(192,192,192)] p-2.5 
                        text-base sm:text-[25px] bg-[--background] shadow-[inset_1px_2px_3px_rgba(0,0,0,0.05)] outline-none w-full sm:w-[500px]" type="text" 
                        placeholder="Search products here">
                </div>

            </div>

            <!-- Scrollable Cart Items Display Area -->
            <section class="flex flex-col items-center w-full px-2 sm:px-4">

                <div class="z-10 flex h-[500px] w-full flex-col items-center overflow-y-auto rounded-lg p-t-[60px] pt-[60px]">
                    
                    <!-- Dynamic Cart Items Insertion Container -->
                    <div data-cart-container class="dbdb text-center flex flex-col gap-4 mb-8 w-full max-w-[1200px] items-center"></div>

                    <!-- HTML Template for Dynamic Item Rendering -->
                    <template data-cart-template class="z-1">

                        <div class="container mx-auto w-full max-w-[1200px] min-h-[90px] sm:min-h-[115px] bg-[var(--shop-item)] flex flex-row items-center justify-between px-2.5 sm:px-8 py-3 border border-gray-600 rounded-xl">
                            <div class="w-full flex flex-row items-center justify-between gap-2.5 sm:gap-8">
                            
                                <!-- Product Image Container -->
                                <div cart-image class="flex-shrink-0 w-20 sm:w-36 aspect-[4/3] flex items-center justify-center overflow-hidden ">
                                    <img src="" class="w-full h-full object-contain p-1">
                                </div>
                                
                                <!-- Product Title, Quantity Adjuster & Pricing -->
                                <div cart-content class="flex-1 flex flex-col sm:flex-row items-start sm:items-center justify-between min-w-0 gap-2 px-1">
                                    <h3 title class="text-xs sm:text-xl font-medium text-white truncate text-left"></h3>

                                    <div class="flex flex-row gap-4 items-center">
                                    <!-- Quantity Controls -->
                                    <div class="flex items-center gap-2 px-2.5 py-1 rounded-lg border border-gray-700">
                                        <button class="quantity-decrease text-white hover:text-red-400 font-bold text-sm sm:text-base px-1 transition-colors" title="Decrease quantity">-</button>
                                        <span quantity-count class="text-xs sm:text-base font-semibold text-white px-2">1</span>
                                        <button class="quantity-increase text-white hover:text-green-400 font-bold text-sm sm:text-base px-1 transition-colors" title="Increase quantity">+</button>
                                    </div>

                                    <h3 price class="text-xs sm:text-xl font-medium text-white whitespace-nowrap"></h3>
                                    </div>
                                </div>
                                
                                <!-- Item Removal Button (Trash Icon) -->
                                <div data-cart-remove class="flex items-center justify-end flex-shrink-0 text-[--text]">
                                    <button class="remove p-2 text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-lg transition-all duration-200 flex items-center justify-center" title="Remove item" aria-label="Remove item">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M3 6h18" />
                                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                                            <line x1="10" y1="11" x2="10" y2="17" />
                                            <line x1="14" y1="11" x2="14" y2="17" />
                                        </svg>
                                    </button>
                                </div>

                            </div>
                        </div>

                    </template>

                </div>

            </section>

        </section>

        <!-- Payment & Checkout Section -->
        <section class="w-full flex flex-col justify-center items-center mx-auto p-4 sm:p-8 text-gray-400 bg-[var(--background,#1e1e1e)] rounded-xl mt-6">

            <!-- Payment Method Selection Tabs -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4 sm:gap-6 mb-8 sm:mb-12"> 

                <h2 class="text-lg font-medium whitespace-nowrap text-gray-400">Payment Method:</h2>

                <div class="flex flex-wrap sm:flex-row gap-2 sm:gap-4 w-full sm:w-auto">

                    <!-- Credit Card Selector -->
                    <button id="payButton1" class="text-sm pay-button flex-1 sm:flex-none px-4 sm:px-6 py-2.5 rounded-md font-medium border border-red-500 bg-transparent text-red-500 hover:text-gray-300 transition duration-200" onclick="choosePayment('payButton1')">
                        <span class="text-sm">Credit Card</span>
                    </button>
                    
                    <!-- PayNow Selector -->
                    <button id="payButton2" class="pay-button flex-1 sm:flex-none px-4 sm:px-6 py-2.5 rounded-md border border-gray-700 bg-transparent text-gray-500 hover:text-gray-300 transition duration-200" onclick="choosePayment('payButton2'); showQR('PayNow')">
                        <span class="text-sm">Pay Now</span>
                    </button>
                    
                    <!-- DBS PayLah! Selector -->
                    <button id="payButton3" class="pay-button flex-1 sm:flex-none px-4 sm:px-6 py-2.5 rounded-md border border-gray-700 bg-transparent text-gray-500 hover:text-gray-300 transition duration-200" onclick="choosePayment('payButton3'); showQR('paylah')">
                        <span class="text-sm">DBS PayLah!</span>
                    </button>
                </div>

            </div>

            <!-- Payment Details Form Container -->
            <div class="w-full max-w-xl mx-auto">

                <!-- Card Header & Supported Card Logos -->
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end mb-4 gap-2 sm:gap-0">
                    <h3 class="text-lg font-medium text-gray-400">Add Credit Card Information</h3>

                    <div class="flex items-center bg-white px-2 py-1 rounded gap-1.5 h-6 opacity-80">
                        <span class="text-[9px] font-black italic text-blue-900 tracking-tighter">VISA</span>
                        <span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block -mr-1.5 opacity-80"></span>
                        <span class="w-2.5 h-2.5 rounded-full bg-yellow-500 inline-block opacity-80"></span>
                        <span class="text-[9px] font-mono font-bold text-gray-800"> JCB</span>
                        <span class="text-[7px] font-sans font-extrabold text-blue-500 bg-blue-100 px-0.5 rounded">AMEX</span>
                    </div>

                </div>

                <!-- Promo Code Input Group -->
                <div class="flex gap-2 max-w-sm mx-auto my-6">

                    <input 
                        type="text" 
                        id="promoInput" 
                        placeholder="PROMO CODE: ENTER CODE" 
                        class="w-full px-4 py-2 bg-[var(--background)] border border-gray-700 rounded-lg text-gray-200 placeholder-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 uppercase"
                    />

                    <button 
                        onclick="checkPromo()" 
                        class="px-5 py-2 main-button font-semibold rounded-lg cursor-pointer"
                    >
                        Submit
                    </button>

                </div>

                <!-- Credit Card Form Fields -->
                <form id="paymentForm" onsubmit="return false;" class="space-y-6">
                    
                    <!-- Card Number Input Field -->
                    <div class="flex flex-col gap-1">
                        <label for="cardNumber" class="text-sm text-gray-400 font-medium">Card Number</label>
                        <input id="cardNumber" class="w-full text-gray-200 placeholder-gray-600 border border-gray-700 rounded-md p-4 outline-none focus:border-gray-500 transition duration-200 bg-[var(--background,#1a1a1a)]" 
                            placeholder="Card Number">
                        <p id="cardNumber-alert" class="text-red-400 text-sm hidden"></p>
                    </div>
                    
                    <!-- Expiry Date & CVV Inputs -->
                    <div class="flex flex-col sm:flex-row gap-4">

                        <!-- Expiry Date Input -->
                        <div class="flex flex-col w-full sm:w-2/3 gap-1">
                            <label for="expiry" class="text-sm text-gray-400 font-medium">Expiry Date</label>
                            <input id="expiry" class="w-full text-gray-200 placeholder-gray-600 border border-gray-700 rounded-md p-4 outline-none focus:border-gray-500 transition duration-200 bg-[var(--background,#1a1a1a)]" 
                                placeholder="Expiry Date (MM/YY)">

                            <p id="expiry-alert" class="text-red-400 text-sm hidden"></p>
                        </div>
                        
                        <!-- CVV Input -->
                        <div class="flex flex-col w-full sm:w-1/3 gap-1">
                            <label for="CVV" class="text-sm text-gray-400 font-medium">CVV</label>
                            <input id="CVV" class="w-full text-gray-200 placeholder-gray-600 border border-gray-700 rounded-md p-4 outline-none focus:border-gray-500 transition duration-200 bg-[var(--background,#1a1a1a)]" 
                                placeholder="CVV">
                                
                            <p id="CVV-alert" class="text-red-400 text-sm hidden"></p>
                        </div>

                    </div>
                    
                    <!-- Name on Card Input Field -->
                    <div class="flex flex-col gap-1">
                        <label for="cardName" class="text-sm text-gray-400 font-medium">Name on Card</label>
                        <input id="cardName" class="w-full text-gray-200 placeholder-gray-600 border border-gray-700 rounded-md p-4 outline-none focus:border-gray-500 transition duration-200 bg-[var(--background,#1a1a1a)]" 
                            placeholder="Name on card">

                        <p id="cardName-alert" class="text-red-400 text-sm hidden"></p>
                    </div>

                    <!-- Order Total Summary & Pay Trigger Button -->
                    <div class="w-full border-b border-gray-600 px-2 sm:px-6 py-4 flex flex-col sm:flex-row items-center justify-between sm:justify-end gap-4 sm:gap-8 bg-[var(--background,#1a1a1a)]">

                        <!-- Dynamic Summary Counter -->
                        <div class="text-gray-300 tracking-wide text-sm select-none text-center sm:text-left">
                            Total (<span id="checkout-item-count">0</span> items): <span class="font-medium">$<span id="checkout-total-price">0.00</span></span>
                        </div>
                        
                        <!-- Submit Payment Button -->
                        <button type="submit" id="payButton" class="w-full sm:w-auto px-12 py-2 main-button transition-200 font-semibold shadow-md rounded-md" onclick="print()">
                            Pay
                        </button>

                    </div>

                </form>

            </div>
        
        </section>

    </article>

    <div id="footer-container"></div>
</body>

</html>
