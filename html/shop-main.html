<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie-edge">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Shopping</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="/images/neXuslogo2.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="../css/style.css">

    <script src="../javascript/main-shop.js" defer></script>
    <script src="../javascript/header-footer.js" defer></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://assets.codepen.io/16327/SplitText3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/TextPlugin.min.js"></script>
</head>

<!-- DONE BY LIANG JUN -->

<body class="min-h-screen flex flex-col">
    <div id="header-container" class="sticky top-0 z-50"></div>

    <section class="w-full h-[calc(100vh-80px)] min-h-[500px] flex flex-col items-center justify-center text-center px-4 relative  select-none gap-8">

        <!-- Title & Subtitle Container -->
        <div class="main-headline flex flex-col items-center justify-center gap-3">
            <h1 class="text-5xl sm:text-7xl md:text-8xl font-black text-white tracking-wider ">
                neXus <span class="text-[var(--maingreen)]">SHOP</span>
            </h1>
            <p tagline class="text-xs sm:text-sm md:text-base font-semibold text-gray-400 tracking-[0.25em] uppercase">
                ONLY THE BEST QUALITY PRODUCTS
            </p>
        </div>
    </section>

    <template id="product-card-template">
        <div class="product-card w-full max-w-[280px] bg-[var(--shop-item)] rounded-xl border border-gray-200 hover:shadow-md transition-all duration-200 flex flex-col items-center overflow-hidden cursor-pointer">
            <div class="w-full p-2.5 flex flex-col h-full justify-between">
                <div>
                    <div class="w-full rounded-lg aspect-square overflow-hidden bg-gray-50">
                        <img data-image src="" alt="" class="w-full h-full object-cover">
                    </div>
                    <div class="py-2 text-left w-full flex flex-col gap-1.5">
                        <h3 data-title class="text-xs sm:text-sm font-normal text-white line-clamp-2 leading-tight"></h3>
                        <div class="flex flex-row justify-between items-center gap-1">
                            <p data-price class="text-red-500 font-semibold text-sm"></p>
                            <p class="text-[10px] sm:text-xs text-white font-medium">Free shipping available</p>
                        </div>
                    </div>
                </div>
                <div class="flex flex-row justify-between w-full gap-1.5 mt-2">
                    <button data-add-cart class="rounded-md bg-[var(--maingreen)] flex-1 h-8 px-1.5 transition hover:bg-[var(--hovergreen)] text-xs font-medium text-white">
                        Add to Cart
                    </button>
                    <a data-buy-now href="../html/payment.html" class="rounded-md bg-[var(--maingreen)] flex-1 h-8 px-1.5 transition hover:bg-[var(--hovergreen)] text-xs font-medium text-white flex items-center justify-center text-center">
                        Buy Now
                    </a>
                </div>
            </div>
        </div>
    </template>


    <main class="flex-grow flex flex-col items-center w-full px-4 sm:px-6 lg:px-8 py-6">
        <div class="z-10 flex w-full max-w-7xl flex-col items-center">
            
            <!-- Search Input -->
            <div class="flex flex-col sm:flex-row items-center justify-center w-full gap-4 mb-6">
                <input id="search" class="w-full h-12 rounded border border-gray-300 p-3 text-base shadow-inner outline-none sm:max-w-md" type="text" placeholder="Search products here" style="background-color: var(--background)">
            </div>

            <!-- Count Indicator -->
            <div class="flex flex-row justify-between w-3/4 mb-4">
                <div class="flex flex-row items-center gap-4">
                    <label for="sort-select" class="text-sm font-medium text-white">Sort by Price:</label>
                    <select id="sort-select" class="bg-[var(--background)] text-white border border-gray-700 rounded-md p-1.5 text-sm">
                        <option value="default">Featured</option>
                        <option value="low-high">Price: Low to High</option>
                        <option value="high-low">Price: High to Low</option>
                    </select>
                </div>

                <h2 class="mb-6 text-sm sm:text-base font-medium">
                    <span id="current-count">10</span> out of <span id="max-count">10</span> found
                </h2>

            </div>
            
            <!-- Product Grid (4 columns on md screens and up) -->
            <div class="w-full">
                <section id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 justify-items-center">

                </section>                   
            </div>
        </div>
    </main>

    <div id="footer-container"></div>
    <script src="../javascript/shop-only.js" defer></Script>
    <script>
        const navigationEntries = performance.getEntriesByType("navigation");
        const isReload = navigationEntries.length > 0 && navigationEntries[0].type === "reload";

        if (isReload) {
            localStorage.removeItem("userCart");
        }

        

    
    </script>
</body>
</html>
