<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Double Helix Gallery</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.13/tailwind.min.js"></script>
<style>
  :root {
    --card-width: 225px;
    --card-height: 155px;
    --perspective: 1200px;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #0d0d0c;
  }

  .scene {
    position: relative;
    height: 100vh;
    perspective: var(--perspective);
    perspective-origin: 50% 50%;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }

  .scene:active { cursor: grabbing; }

  .world {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
  }

  .card {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--card-width);
    height: var(--card-height);
    border-radius: 10px;
    background-size: cover;
    background-position: center;
    will-change: transform, filter;
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(to bottom, #0d0d0c 0%, transparent 18%, transparent 82%, #0d0d0c 100%),
      radial-gradient(ellipse 90% 80% at 50% 50%, transparent 55%, rgba(13, 13, 12, 0.9) 100%);
  }
</style>
</head>
<body class="m-0 p-0 box-border">

<div class="scene">
  <div class="world" id="world"></div>
  <div class="vignette"></div>
</div>

<script>
// ----------------------------------------------------------------
// Config — every tunable number for the effect lives here
// ----------------------------------------------------------------
const config = {
  scene: {
    strands: 2,        // number of intertwined spirals
    perStrand: 20,      // cards per strand
    turns: 2,           // full rotations top -> bottom (must be integer for seamless wrap)
    speed: 0.25,        // cards/second of ambient descent
    spanFactor: 1.5      // strand height relative to viewport (runs off both edges)
  },
  appearance: {
    palette: [
      "#7d9183", "#5b7ea3", "#c9bfa8", "#4f7d78", "#a9836a",
      "#6b7280", "#77805e", "#66757f", "#8a8478", "#96876f",
      "#5e7268", "#6f7d8c", "#847e6a", "#4e6a74"
    ],
    paletteStrandOffset: 7, // keeps adjacent strands from repeating colors
    brightnessFloor: 0.12,
    maxBlur: 5
  },
  image: {
    width: 520,  // 2x largest breakpoint's card size, for sharpness
    height: 360
  },
  interaction: {
    friction: 0.94,      // per-frame velocity decay after release (60fps reference)
    minMomentum: 0.0005
  },
  breakpoints: [
    { minWidth: 1440, radius: 560, perspective: 1400, cardWidth: 260, cardHeight: 180 },
    { minWidth: 1024, radius: 420, perspective: 1200, cardWidth: 225, cardHeight: 155 },
    { minWidth: 640,  radius: 310, perspective: 1000, cardWidth: 170, cardHeight: 118 },
    { minWidth: 0,    radius: 220, perspective: 850,  cardWidth: 128, cardHeight: 88 }
  ]
};

// ----------------------------------------------------------------
// Math helpers
// ----------------------------------------------------------------
const wrap = (value, length) => ((value % length) + length) % length;

const helixAngle = (progress, phase) =>
  progress * config.scene.turns * 2 * Math.PI + phase;

// depth toward the camera, normalized 0 (far side) .. 1 (near side)
const depthOf = (angle) => (Math.cos(angle) + 1) / 2;

// stuck to the outside of the cylinder: rotate to the angle, then push outward
const helixTransform = (angle, y, radius) =>
  `translate(-50%, -50%) rotateY(${angle.toFixed(4)}rad) translateZ(${radius}px) translateY(${y.toFixed(1)}px)`;

const depthFilter = (depth) => {
  const { brightnessFloor, maxBlur } = config.appearance;
  const brightness = brightnessFloor + (1 - brightnessFloor) * depth * depth;
  const blur = (1 - depth) * (1 - depth) * maxBlur;
  return `brightness(${brightness.toFixed(3)}) blur(${blur.toFixed(2)}px)`;
};

// ----------------------------------------------------------------
// Viewport tracking — picks a responsive tier and pushes CSS vars
// ----------------------------------------------------------------
const createViewportTracker = () => {
  const view = { span: 0, radius: 0 };

  const pickBreakpoint = () =>
    config.breakpoints.find((bp) => window.innerWidth >= bp.minWidth) ??
    config.breakpoints[config.breakpoints.length - 1];

  const apply = () => {
    const bp = pickBreakpoint();
    view.span = window.innerHeight * config.scene.spanFactor;
    view.radius = bp.radius;

    const root = document.documentElement.style;
    root.setProperty("--card-width", `${bp.cardWidth}px`);
    root.setProperty("--card-height", `${bp.cardHeight}px`);
    root.setProperty("--perspective", `${bp.perspective}px`);
  };

  apply();
  window.addEventListener("resize", apply);
  return () => view;
};

// ----------------------------------------------------------------
// Cards
// ----------------------------------------------------------------
const { strands, perStrand } = config.scene;
const { palette, paletteStrandOffset } = config.appearance;

const imageUrl = (strand, index) =>
  `https://picsum.photos/seed/helix-${strand}-${index}/${config.image.width}/${config.image.height}`;

const placeholderColor = (strand, index) =>
  palette[(index + strand * paletteStrandOffset) % palette.length];

const createCard = (strand, index) => {
  const el = document.createElement("div");
  el.className = "card";
  el.style.backgroundColor = placeholderColor(strand, index);
  el.style.backgroundImage = `url(${imageUrl(strand, index)})`;
  return { el, base: index, phase: (strand / strands) * 2 * Math.PI };
};

const createCards = (world) => {
  const cards = [];
  for (let strand = 0; strand < strands; strand++) {
    for (let index = 0; index < perStrand; index++) {
      const card = createCard(strand, index);
      world.appendChild(card.el);
      cards.push(card);
    }
  }
  return cards;
};

const renderCards = (cards, elapsed, travel, view) => {
  for (const card of cards) {
    // progress along the strand, 0 (top, offscreen) .. 1 (bottom, offscreen)
    const progress = wrap(card.base + elapsed * config.scene.speed + travel, perStrand) / perStrand;
    const angle = helixAngle(progress, card.phase);
    const y = (progress - 0.5) * view.span;
    card.el.style.transform = helixTransform(angle, y, view.radius);
    card.el.style.filter = depthFilter(depthOf(angle));
  }
};

// ----------------------------------------------------------------
// Drag — scrubs the spiral along its own path of motion
// ----------------------------------------------------------------
const createDrag = (surface, getRadius) => {
  const { friction, minMomentum } = config.interaction;
  const { turns } = config.scene;

  // converts px of horizontal drag into strand progress (in cards) such that
  // front cards track the pointer at roughly 1:1 at the current helix radius
  const sensitivityFor = (radius) => (1 / radius) * (perStrand / (turns * 2 * Math.PI));

  const state = { travel: 0, velocity: 0, dragging: false, lastX: 0, lastMoveTime: 0 };

  const onDown = (e) => {
    state.dragging = true;
    state.velocity = 0;
    state.lastX = e.clientX;
    state.lastMoveTime = e.timeStamp;
    surface.setPointerCapture(e.pointerId);
  };

  const onMove = (e) => {
    if (!state.dragging) return;
    const dx = e.clientX - state.lastX;
    const dt = (e.timeStamp - state.lastMoveTime) / 1000;
    state.lastX = e.clientX;
    state.lastMoveTime = e.timeStamp;
    const dTravel = dx * sensitivityFor(getRadius());
    state.travel += dTravel;
    if (dt > 0) state.velocity = dTravel / dt;
  };

  const onUp = () => { state.dragging = false; };

  surface.addEventListener("pointerdown", onDown);
  surface.addEventListener("pointermove", onMove);
  surface.addEventListener("pointerup", onUp);
  surface.addEventListener("pointercancel", onUp);

  const coast = (dt) => {
    if (state.dragging || state.velocity === 0) return;
    state.travel += state.velocity * dt;
    state.velocity *= Math.pow(friction, dt * 60);
    if (Math.abs(state.velocity) < minMomentum) state.velocity = 0;
  };

  return { state, coast };
};

// ----------------------------------------------------------------
// Boot
// ----------------------------------------------------------------
const scene = document.querySelector(".scene");
const world = document.getElementById("world");

const cards = createCards(world);
const getView = createViewportTracker();
const drag = createDrag(scene, () => getView().radius);
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

const start = performance.now();
let lastFrame = start;

const frame = (now) => {
  const elapsed = reducedMotion.matches ? 0 : (now - start) / 1000;
  const dt = Math.min((now - lastFrame) / 1000, 0.1);
  lastFrame = now;

  drag.coast(dt);
  renderCards(cards, elapsed, drag.state.travel, getView());

  requestAnimationFrame(frame);
};

requestAnimationFrame(frame);
</script>
</body>
</html>
